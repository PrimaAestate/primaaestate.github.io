name: App release changelog
on:
  repository_dispatch:
    types: [app-release, server-release]
concurrency:
  group: site-deploy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Merge changelog entry
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > /tmp/payload.json
          if [ "$EVENT_ACTION" = "server-release" ]; then
            python3 scripts/merge-server-update.py /tmp/payload.json
            node --test scripts/changelog.test.mjs
          else
            python3 scripts/merge-changelog.py /tmp/payload.json
          fi
      - name: Commit
        env:
          EVENT_ACTION: ${{ github.event.action }}
          SLUG: ${{ github.event.client_payload.slug }}
          VERSION: ${{ github.event.client_payload.version }}
          DATE: ${{ github.event.client_payload.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/changelogs docs/data/server-updates/shared.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          if [ "$EVENT_ACTION" = "server-release" ]; then
            LABEL="${VERSION:-$DATE}"
            git commit -m "chore(changelog): server-update ${LABEL}"
          else
            git commit -m "chore(changelog): ${SLUG} ${VERSION}"
          fi
          git push origin HEAD:master
      # Pushes made with GITHUB_TOKEN don't trigger main.yml, so build and deploy here.
      - name: Sync site images from assets branch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin assets
          git archive origin/assets | tar -x -C docs/public --exclude=README.md
          test -f docs/public/og-default.jpg
          test -d docs/public/img/apps
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - run: npm i
      - run: npm run docs:build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          force_orphan: true
