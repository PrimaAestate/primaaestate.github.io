name: Deploy
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync site images from assets branch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin assets
          # Branch root is img/ + og-default.jpg (+ README); extract into docs/public/
          git archive origin/assets | tar -x -C docs/public --exclude=README.md
          test -f docs/public/og-default.jpg
          test -d docs/public/img/apps
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - run: npm i
      - name: Build
        run: npm run docs:build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          force_orphan: true
